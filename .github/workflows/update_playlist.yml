name: Daily Playlist Auto-Updater

on:
  schedule:
    # Runs at 03:00 UTC every day
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write # Required to allow GitHub Actions to commit and push changes back

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        python3 -m venv .venv
        .venv/bin/pip install --upgrade pip
        .venv/bin/pip install aiohttp

    - name: Run Playlist Updater
      run: |
        .venv/bin/python update_library.py

    - name: Commit and Push Changes
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"
        git add .
        if git diff --staged --quiet; then
          echo "No changes to commit."
        else
          git commit -m "Auto-update verified IPTV playlists [skip ci]"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            echo "Push attempt $i failed, waiting 10 seconds..."
            sleep 10
          done
        fi
